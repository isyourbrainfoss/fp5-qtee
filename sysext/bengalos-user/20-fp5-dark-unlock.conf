# FP5 BengalOS 2026-10-31: Nura's fp-wake settings (zz-fp-wake.conf): warm serve session,
# sensor armed while the panel is off and before suspend, a dark hit unlocks and turns
# the screen on (org.gnome.ScreenSaver.SetActive false). Kernel side: focaltech-fp
# wakeup-source (enable_irq_wake on gpio34 at suspend while armed).
# Sleep: the sensor stays armed into s2idle (touch-to-wake). Opt-in to disarm on
# suspend: Environment=FP5_QTEE_SLEEP_DISARM=1 (docs/fp-wake.md).
# Revert: rm this file; systemctl --user daemon-reload; systemctl --user restart fp5-qtee-unlock
[Service]
Environment=PYTHONUNBUFFERED=1
Environment=FP5_QTEE_WARM=1
Environment=FP5_QTEE_WAKE=1
Environment=FP5_QTEE_FF_RESTORE_GAIN=0xffff
