# fp5-cell-backoff: only bring up the ims PDN when the network gives packet
# service. Without it, ims-pdn-up.sh retries for 14 min, fails, and systemd
# restarts it every 2 min forever; a retry in flight at suspend wakes the phone.
# A failed condition skips the start cleanly (no restart loop); fp5-cell-backoff
# starts imsd as soon as packet service is back.
[Service]
ExecCondition=/usr/local/bin/fp5-cell-backoff ps-attached
