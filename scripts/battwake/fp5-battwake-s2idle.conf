# fp5-battwake (optional, NOT installed by default): use s2idle instead of
# deep for systemd suspend. In s2idle a battmgr notification only ends sleep
# when it is a wakeup event, which fp5-battwake-apply turns off; in deep the
# ADSP's IPCC interrupt resumes the SoC regardless. See docs/battwake.md for
# the measured trade-off. systemd >= 256 reads this at each suspend.
[Sleep]
MemorySleepMode=s2idle
