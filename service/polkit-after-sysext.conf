# polkit reads /usr/share/polkit-1/actions only at start. Start it after
# the fp5-qtee sysext is merged, or the org.fp5.qtee.* and
# net.reactivated.fprint.* actions are "not registered" after boot and
# the lock-screen fingerprint unlock fails.
#
# Install this as /etc/systemd/system/polkit.service.d/10-after-sysext.conf
# (sysext/install-etc.sh does it). The copy the sysext ships under
# /usr/lib/systemd/system/polkit.service.d/ is only read once the image is
# merged, which can be after polkit has started when the sysext is merged
# late (e.g. by fp5-fpnfc-sysext.service); /etc is read from the start.
# After= on a unit that does not exist is ignored.
[Unit]
After=systemd-sysext.service fp5-fpnfc-sysext.service
Wants=systemd-sysext.service
